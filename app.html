<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichajes · Pool Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tq:#03A1BE; --tq-osc:#027F96; --tq-claro:#E2F4F8; --gris:#555962;
  --tinta:#24272D; --suave:#6B7079; --fondo:#F1F4F5; --papel:#FFFFFF; --linea:#DCE2E5;
  --ambar:#B97F00; --ambar-claro:#FBF1DA; --rojo:#BC4239; --rojo-claro:#F8E3E1; --verde:#2C8A5F; --verde-claro:#E1F2E9;
  --cabecera:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --tq:#18B3CF; --tq-osc:#5CCDE2; --tq-claro:#0E3640; --tinta:#E7EAEC; --suave:#9BA1A9; --fondo:#14171B;
    --papel:#1D2126; --linea:#2D333A; --ambar:#E2A93A; --ambar-claro:#3A2E12; --rojo:#E57066; --rojo-claro:#3D1E1B;
    --verde:#55C08E; --verde-claro:#163326; --cabecera:#2B2F36; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--tinta);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tq);outline-offset:2px}

/* Cabecera */
.cab{background:var(--cabecera);color:var(--tinta);padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.cab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--tq)}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca img{height:34px;width:auto;display:block}
.marca .osc{display:none}
.marca span{font-weight:500;color:var(--suave);font-size:14px;padding-left:12px;border-left:1px solid var(--linea);line-height:28px}
.yo{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--tq-claro);color:var(--tq-osc);display:grid;place-items:center;font-weight:600;font-size:13px}
@media (prefers-color-scheme:dark){.marca .cla{display:none}.marca .osc{display:block}}

main{max-width:560px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--linea);display:flex;justify-content:center;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.tabs button{flex:1;max-width:112px;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;font-weight:500;color:var(--suave);border-radius:10px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--tq)}
.tabs .punto{position:absolute;margin:-2px 0 0 18px;width:8px;height:8px;border-radius:50%;background:var(--rojo)}

/* Hoy */
.fecha{color:var(--suave);font-weight:500;font-size:14px;margin:0}
.reloj{font-size:56px;font-weight:300;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.reloj small{font-size:22px;color:var(--suave);font-weight:400;margin-left:4px}
.estado{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin-bottom:18px}
.estado i{width:10px;height:10px;border-radius:50%;background:var(--suave);flex:none}
.estado.trabajando i{background:var(--verde);box-shadow:0 0 0 4px var(--verde-claro)}
.estado.pausa i{background:var(--ambar);box-shadow:0 0 0 4px var(--ambar-claro)}
.estado.fin i{background:var(--gris)}
.estado span{font-weight:400;color:var(--suave)}

.calle{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:16px 16px 12px;margin-bottom:16px}
.pista{position:relative;height:30px;border-radius:8px;background:var(--fondo);overflow:hidden}
.pista .prev{position:absolute;top:0;bottom:0;background:var(--tq-claro)}
.pista .com{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--linea) 5px 7px)}
.pista .tr{position:absolute;top:5px;bottom:5px;background:var(--tq);border-radius:4px}
.pista .pa{position:absolute;top:11px;bottom:11px;background:var(--ambar);border-radius:3px;opacity:.85}
.pista .ya{position:absolute;top:0;bottom:0;width:2px;background:var(--tinta)}
.marcas{position:relative;height:18px;margin-top:6px;font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
.marcas span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.marcas span:first-child{transform:none}
.marcas span:last-child{transform:translateX(-100%)}
.cifras{display:flex;gap:22px;margin-top:10px}
.cifras div{font-size:13px;color:var(--suave)}
.cifras b{display:block;font-size:20px;font-weight:600;color:var(--tinta);font-variant-numeric:tabular-nums}

.botones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.fichar{border:1.5px solid var(--linea);background:var(--papel);border-radius:14px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:96px;transition:transform .08s}
.fichar svg{width:26px;height:26px;color:var(--tq)}
.fichar b{font-weight:600;font-size:16px}
.fichar:active:not(:disabled){transform:scale(.98)}
.fichar:disabled{opacity:.38;cursor:default}
.fichar.sug{background:var(--tq);border-color:var(--tq);color:#fff}
.fichar.sug svg{color:#fff}

.aviso{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;background:var(--ambar-claro);color:var(--tinta);border-left:4px solid var(--ambar)}
.aviso.info{background:var(--tq-claro);border-color:var(--tq)}

h2{font-size:15px;font-weight:600;margin:0 0 10px}
.linea-t{list-style:none;margin:0;padding:0 0 0 4px}
.linea-t li{display:flex;align-items:baseline;gap:12px;padding:8px 0 8px 18px;position:relative;border-left:2px solid var(--linea)}
.linea-t li::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--papel);border:2px solid var(--tq)}
.linea-t li.PAUSA::before{border-color:var(--ambar)}
.linea-t li.SALIDA::before{background:var(--gris);border-color:var(--gris)}
.linea-t .h{font-weight:600;font-variant-numeric:tabular-nums;min-width:66px}
.linea-t .o{color:var(--suave);font-size:13px}
.linea-t li.tachado .h,.linea-t li.tachado .t{text-decoration:line-through;color:var(--suave)}
.vacio{color:var(--suave);font-size:14px;padding:6px 0}

/* Historial */
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mes h1{font-size:22px;font-weight:600;margin:0;text-transform:capitalize}
.flecha{width:40px;height:40px;border-radius:50%;border:1px solid var(--linea);background:var(--papel);display:grid;place-items:center}
.flecha:disabled{opacity:.35}
.resumen{display:flex;gap:24px;margin-bottom:16px;padding:14px 16px;background:var(--papel);border:1px solid var(--linea);border-radius:14px}
.resumen div{font-size:13px;color:var(--suave)}
.resumen b{display:block;font-size:22px;color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums}
.dias{background:var(--papel);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.dia{border-bottom:1px solid var(--linea)}
.dia:last-child{border-bottom:0}
.dia>button{width:100%;background:none;border:0;padding:12px 14px;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;text-align:left}
.dia .n{font-size:20px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.dia .n small{display:block;font-size:11px;font-weight:500;color:var(--suave);margin-top:3px}
.dia .det{font-size:14px;font-variant-numeric:tabular-nums}
.dia .det em{font-style:normal;color:var(--suave);font-size:13px;display:block}
.dia .tot{font-weight:600;font-variant-numeric:tabular-nums}
.dia.apagado .n,.dia.apagado .det{color:var(--suave)}
.dia .mas{padding:0 14px 14px 68px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fondo);color:var(--suave)}
.chip.ok{background:var(--verde-claro);color:var(--verde)}
.chip.mal{background:var(--rojo-claro);color:var(--rojo)}
.chip.esp{background:var(--ambar-claro);color:var(--ambar)}
.chip.inf{background:var(--tq-claro);color:var(--tq-osc)}

/* Solicitudes */
.cab-sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.cab-sec h1{font-size:22px;font-weight:600;margin:0}
.ayuda{color:var(--suave);font-size:14px;margin:-6px 0 16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--tq);color:#fff}
.btn.sec{background:var(--papel);color:var(--tinta);border:1px solid var(--linea)}
.btn.peligro{background:var(--papel);color:var(--rojo);border:1px solid var(--linea)}
.btn.chico{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.lista{display:flex;flex-direction:column;gap:10px}
.sol{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px}
.sol .t1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sol b{font-weight:600}
.sol p{margin:6px 0 0;font-size:14px;color:var(--suave)}
.sol .acc{display:flex;gap:8px;margin-top:12px}

/* Equipo */
.persona{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linea)}
.persona:last-child{border-bottom:0}
.persona i{width:10px;height:10px;border-radius:50%;background:var(--linea)}
.persona i.trabajando{background:var(--verde)} .persona i.pausa{background:var(--ambar)} .persona i.fin{background:var(--gris)} .persona i.tarde{background:var(--rojo)}
.persona small{display:block;color:var(--suave);font-size:13px;font-variant-numeric:tabular-nums}
.bloque{margin-top:26px}

/* Hoja inferior */
.velo{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:20;display:none}
.velo.abierta{display:block}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--papel);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease,visibility .22s;max-width:600px;margin:0 auto}
.hoja{visibility:hidden}
.hoja.abierta{transform:none;visibility:visible}
.hoja .asa{width:40px;height:4px;border-radius:2px;background:var(--linea);margin:0 auto 14px}
.hoja h3{font-size:19px;font-weight:600;margin:0 0 4px}
.hoja .sub{color:var(--suave);margin:0 0 16px;font-size:14px}
.gran-hora{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;margin:4px 0 14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--fondo);font-size:15px}
textarea{min-height:76px;resize:vertical}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.interruptor{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;font-weight:500}
.interruptor input{width:20px;height:20px;accent-color:var(--tq)}
.pie-hoja{display:flex;gap:10px;margin-top:20px}
.pie-hoja .btn{flex:1;padding:14px}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--tinta);color:var(--papel);
  padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;transition:.2s;max-width:90vw;pointer-events:none}
.toast.ver{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--rojo);color:#fff}
.cargando{padding:60px 0;text-align:center;color:var(--suave)}
.error-total{padding:40px 6px;text-align:center}
.error-total p{color:var(--suave)}
.demo{font-size:12px;text-align:center;color:var(--suave);margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const fechaISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const horaAhora = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const aMin = h => { if (!h) return null; const p = String(h).split(':'); return +p[0] * 60 + +p[1] + (p[2] ? +p[2] / 60 : 0); };
const minAhora = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const hm = h => String(h || '').slice(0, 5);
const dur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r + ' min' : '') : r + ' min'; };
const durCorta = m => { m = Math.max(0, Math.round(m)); return Math.floor(m / 60) + ':' + pad(m % 60); };
const fechaLarga = f => { const d = new Date(f + 'T12:00:00'); return DIAS_L[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const fechaCorta = f => { const d = new Date(f + 'T12:00:00'); return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3); };
const diaSemana = f => { const d = new Date(f + 'T12:00:00').getDay(); return d === 0 ? 7 : d; };
const horarioDe = (hor, fecha) => { const e = hor.especiales && hor.especiales[diaSemana(fecha)]; return e ? Object.assign({}, hor, e) : hor; };
const iniciales = n => String(n || '?').split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();

function efectivos(lista) {
  const sust = {};
  lista.forEach(f => { if (/^Sustituye/.test(f.origen)) sust[f.fecha + f.tipo] = 1; });
  return lista.filter(f => /^Sustituye/.test(f.origen) || !sust[f.fecha + f.tipo]).sort((a, b) => a.hora.localeCompare(b.hora));
}

/** Recorre los fichajes y devuelve estado, minutos trabajados, de comida y tramos */
function calcular(lista, ahora) {
  let estado = 'fuera', trab = 0, pausa = 0, ini = null, desde = null;
  const tramos = [];
  efectivos(lista).forEach(f => {
    const m = aMin(f.hora);
    if (f.tipo === 'ENTRADA' && (estado === 'fuera' || estado === 'fin')) { ini = m; estado = 'trabajando'; desde = f.hora; }
    else if (f.tipo === 'PAUSA' && estado === 'trabajando') { trab += m - ini; tramos.push({ t: 'tr', a: ini, b: m }); ini = m; estado = 'pausa'; desde = f.hora; }
    else if (f.tipo === 'REANUDAR' && estado === 'pausa') { pausa += m - ini; tramos.push({ t: 'pa', a: ini, b: m }); ini = m; estado = 'trabajando'; desde = f.hora; }
    else if (f.tipo === 'SALIDA' && (estado === 'trabajando' || estado === 'pausa')) {
      if (estado === 'trabajando') { trab += m - ini; tramos.push({ t: 'tr', a: ini, b: m }); } else { pausa += m - ini; tramos.push({ t: 'pa', a: ini, b: m }); }
      estado = 'fin'; desde = f.hora;
    }
  });
  if (ahora != null && (estado === 'trabajando' || estado === 'pausa')) {
    const b = Math.max(ahora, ini);
    if (estado === 'trabajando') { trab += b - ini; tramos.push({ t: 'tr', a: ini, b, vivo: 1 }); } else { pausa += b - ini; tramos.push({ t: 'pa', a: ini, b, vivo: 1 }); }
  }
  return { estado, trab, pausa, tramos, desde };
}

function permitidos(estado) {
  return { ENTRADA: estado === 'fuera' || estado === 'fin', PAUSA: estado === 'trabajando', REANUDAR: estado === 'pausa', SALIDA: estado === 'trabajando' || estado === 'pausa' };
}

function sugerido(estado, lista, hor) {
  if (estado === 'fuera' || estado === 'fin') return estado === 'fin' ? null : 'ENTRADA';
  if (estado === 'pausa') return 'REANUDAR';
  const yaComio = lista.some(f => f.tipo === 'PAUSA');
  const finComida = aMin(hor.comidaFin);
  return !yaComio && hor.comidaIni && (finComida == null || minAhora() < finComida) ? 'PAUSA' : 'SALIDA';
}

let tToast;
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast ver' + (err ? ' err' : '');
  clearTimeout(tToast); tToast = setTimeout(() => t.className = 'toast' + (err ? ' err' : ''), err ? 4500 : 2600);
}

function api(fn, ...args) {
  if (EN_GAS) return new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => mal(e && e.message ? e : new Error(String(e))))[fn](...args));
  return new Promise((ok, mal) => setTimeout(() => { try { ok(JSON.parse(JSON.stringify(DEMO[fn](...args)))); } catch (e) { mal(e); } }, 120));
}
const textoError = e => String(e && e.message || e).replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '');

/* ================================ Navegación ================================ */
function pintarTabs() {
  const u = S.datos && S.datos.usuario;
  const items = [['hoy', 'Hoy', ICON.hoy], ['hist', 'Historial', ICON.hist], ['inc', 'Incidencias', ICON.inc], ['aus', 'Ausencias', ICON.aus]];
  if (u && u.admin) items.push(['eq', 'Equipo', ICON.eq]);
  $('tabs').innerHTML = items.map(([k, t, i]) =>
    `<button data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${i}<span>${t}</span>${k === 'eq' && S.pendAdmin ? '<span class="punto"></span>' : ''}</button>`).join('');
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) irA(b.dataset.tab); });

function irA(tab) {
  S.tab = tab; pintarTabs(); window.scrollTo(0, 0);
  if (tab === 'hoy') pintarHoy();
  if (tab === 'hist') cargarHistorial(S.mes || S.datos.hoy.slice(0, 7));
  if (tab === 'inc' || tab === 'aus') cargarSolicitudes();
  if (tab === 'eq') cargarEquipo();
}

/* ==================================== HOY ==================================== */
function pintarHoy() {
  const d = S.datos, u = d.usuario, hor = horarioDe(u.horario, d.hoy);
  const c = calcular(d.fichajes, minAhora());
  const perm = permitidos(c.estado);
  const sug = sugerido(c.estado, d.fichajes, hor);
  const textoEstado = {
    fuera: ['Sin fichar', hor.entrada ? 'tu entrada es a las ' + hor.entrada : ''],
    trabajando: ['Trabajando', 'desde las ' + hm(c.desde)],
    pausa: ['En la pausa de comida', 'desde las ' + hm(c.desde)],
    fin: ['Jornada terminada', 'salida a las ' + hm(c.desde)]
  }[c.estado];

  let avisos = '';
  if (d.festivo) avisos += `<div class="aviso info">Hoy es festivo: ${esc(d.festivo)}.</div>`;
  d.ausencias.forEach(a => {
    avisos += `<div class="aviso info">Tienes registrada una ausencia: <b>${esc(a.tipo)}</b>${a.diaCompleto ? '' : ' de ' + esc(a.horaIni) + ' a ' + esc(a.horaFin)}${a.estado === 'Pendiente' ? ' (pendiente de aprobar)' : ''}.</div>`;
  });
  if (!d.festivo && hor.dias && hor.dias.indexOf(diaSemana(d.hoy)) < 0) avisos += `<div class="aviso info">Hoy no es uno de tus días laborables.</div>`;

  const minPrev = (aMin(hor.salida) - aMin(hor.entrada)) - ((aMin(hor.comidaFin) - aMin(hor.comidaIni)) || 0);

  $('vista').innerHTML = `
    <p class="fecha">${fechaLarga(d.hoy)}</p>
    <div class="reloj" id="reloj"></div>
    <div class="estado ${c.estado}"><i></i>${textoEstado[0]} <span>${esc(textoEstado[1])}</span></div>
    ${avisos}
    <div class="calle">${pista(hor, c)}
      <div class="cifras">
        <div><b id="cTrab">${dur(c.trab)}</b>trabajado</div>
        <div><b id="cPausa">${dur(c.pausa)}</b>comida</div>
        ${minPrev > 0 ? `<div><b>${dur(minPrev)}</b>previsto</div>` : ''}
      </div>
    </div>
    <div class="botones">
      ${['ENTRADA', 'PAUSA', 'REANUDAR', 'SALIDA'].map(t => `
        <button class="fichar ${sug === t ? 'sug' : ''}" data-fichar="${t}" ${perm[t] ? '' : 'disabled'}>${ICON[t]}<b>${VERBO[t]}</b></button>`).join('')}
    </div>
    <h2>Fichajes de hoy</h2>
    ${listaFichajes(d.fichajes) || '<div class="vacio">Todavía no hay fichajes hoy.</div>'}
    ${EN_GAS ? '' : '<p class="demo">Modo de prueba: los datos se guardan solo en este navegador.</p>'}`;
  tic();
}

function pista(hor, c) {
  const ent = aMin(hor.entrada), sal = aMin(hor.salida), ci = aMin(hor.comidaIni), cf = aMin(hor.comidaFin);
  const puntos = [ent, sal].concat(c.tramos.flatMap(t => [t.a, t.b])).filter(v => v != null);
  if (!puntos.length) return '';
  let a = Math.min(...puntos), b = Math.max(...puntos);
  a = Math.floor((a - 15) / 30) * 30; b = Math.ceil((b + 15) / 30) * 30;
  const x = m => ((m - a) / (b - a) * 100).toFixed(2) + '%';
  const w = (m1, m2) => ((m2 - m1) / (b - a) * 100).toFixed(2) + '%';
  let h = '<div class="pista" aria-hidden="true">';
  if (ent != null && sal != null) h += `<div class="prev" style="left:${x(ent)};width:${w(ent, sal)}"></div>`;
  if (ci != null && cf != null) h += `<div class="com" style="left:${x(ci)};width:${w(ci, cf)}"></div>`;
  c.tramos.forEach(t => h += `<div class="${t.t}" style="left:${x(t.a)};width:${w(t.a, Math.max(t.b, t.a + 1))}"></div>`);
  const ya = minAhora();
  if (ya > a && ya < b) h += `<div class="ya" style="left:${x(ya)}"></div>`;
  h += '</div><div class="marcas">';
  if (ent != null) h += `<span style="left:${x(ent)}">${hor.entrada}</span>`;
  if (ci != null) h += `<span style="left:${x((ci + (cf || ci)) / 2)}">${hor.comidaIni}${hor.comidaFin ? '–' + hor.comidaFin : ''}</span>`;
  if (sal != null) h += `<span style="left:${x(sal)}">${hor.salida}</span>`;
  return h + '</div>';
}

function listaFichajes(lista) {
  if (!lista.length) return '';
  const vivos = new Set(efectivos(lista));
  return '<ul class="linea-t">' + lista.map(f => {
    const tach = !vivos.has(f);
    const ori = f.origen && f.origen !== 'App' ? (tach ? 'sustituido por una corrección' : 'corrección') : '';
    return `<li class="${f.tipo}${tach ? ' tachado' : ''}"><span class="h">${hm(f.hora)}</span><span class="t">${NOMBRE[f.tipo] || esc(f.tipo)}</span>
      ${ori ? `<span class="chip inf">${ori}</span>` : ''}${f.obs ? `<span class="o">${esc(f.obs)}</span>` : ''}</li>`;
  }).join('') + '</ul>';
}

function tic() {
  const r = $('reloj');
  if (!r || S.tab !== 'hoy') return;
  const h = horaAhora();
  r.innerHTML = h.slice(0, 5) + '<small>' + h.slice(6) + '</small>';
}
let ultMin = -1;
setInterval(() => {
  if (S.tab !== 'hoy' || !S.datos) return;
  tic();
  const mAhora = Math.floor(minAhora());
  if (mAhora !== ultMin) {
    ultMin = mAhora;
    const c = calcular(S.datos.fichajes, minAhora());
    if (c.estado === 'trabajando' || c.estado === 'pausa') pintarHoy();
  }
}, 1000);

$('vista').addEventListener('click', e => {
  const f = e.target.closest('[data-fichar]');
  if (f && !f.disabled) return confirmarFichaje(f.dataset.fichar);
  const dia = e.target.closest('[data-dia]');
  if (dia) { S.abierto = S.abierto === dia.dataset.dia ? null : dia.dataset.dia; return pintarHistorial(); }
  const m = e.target.closest('[data-mes]');
  if (m) return cargarHistorial(m.dataset.mes);
  const ni = e.target.closest('[data-nueva-inc]');
  if (ni) return formIncidencia(ni.dataset.nuevaInc || '');
  if (e.target.closest('[data-nueva-aus]')) return formAusencia();
  const an = e.target.closest('[data-anular]');
  if (an) return anular(an.dataset.clase, an.dataset.anular);
  const rs = e.target.closest('[data-resolver]');
  if (rs) return confirmarResolucion(rs.dataset.clase, rs.dataset.resolver, rs.dataset.ok === '1');
});

/* ================================ Hoja inferior ================================ */
function abrirHoja(html) {
  $('hoja').innerHTML = '<div class="asa"></div>' + html;
  $('velo').classList.add('abierta'); $('hoja').classList.add('abierta');
  setTimeout(() => { const p = $('hoja').querySelector('[autofocus]'); if (p) p.focus(); }, 230);
}
function cerrarHoja() { $('velo').classList.remove('abierta'); $('hoja').classList.remove('abierta'); }
$('velo').addEventListener('click', cerrarHoja);
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });

function confirmarFichaje(tipo) {
  abrirHoja(`
    <h3>${VERBO[tipo]}</h3>
    <p class="sub">Se registrará con la hora del servidor.</p>
    <div class="gran-hora" id="hHoja">${hm(horaAhora())}</div>
    <label for="obs">Observaciones (opcional)</label>
    <textarea id="obs" maxlength="300" placeholder="Por ejemplo: visita a obra en Majadahonda"></textarea>
    <div class="pie-hoja"><button class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="ok">${VERBO[tipo]}</button></div>`);
  $('cancelar').onclick = cerrarHoja;
  $('ok').onclick = async () => {
    const b = $('ok'); b.disabled = true; b.textContent = 'Registrando…';
    try {
      let lat = '', lng = '';
      if (S.datos.ajustes && S.datos.ajustes.ubicacion) ({ lat, lng } = await ubicacion());
      const r = await api('fichar', tipo, $('obs').value.trim(), lat, lng);
      S.datos.fichajes = r.fichajes;
      cerrarHoja(); pintarHoy();
      const ult = r.fichajes[r.fichajes.length - 1];
      toast(NOMBRE[tipo] + ' registrada a las ' + hm(ult ? ult.hora : horaAhora()));
    } catch (e) { b.disabled = false; b.textContent = VERBO[tipo]; toast(textoError(e), true); }
  };
}

function ubicacion() {
  return new Promise(ok => {
    if (!navigator.geolocation) return ok({ lat: '', lng: '' });
    navigator.geolocation.getCurrentPosition(p => ok({ lat: p.coords.latitude.toFixed(5), lng: p.coords.longitude.toFixed(5) }),
      () => ok({ lat: '', lng: '' }), { timeout: 6000, maximumAge: 60000 });
  });
}

/* ================================== HISTORIAL ================================== */
async function cargarHistorial(mes) {
  S.mes = mes; S.abierto = null;
  $('vista').innerHTML = '<div class="cargando">Cargando el historial…</div>';
  try { S.hist = await api('historial', mes); if (S.tab === 'hist' && S.mes === mes) pintarHistorial(); }
  catch (e) { errorVista(e); }
}

function pintarHistorial() {
  const mes = S.mes, h = S.hist, hor = S.datos.usuario.horario, hoy = S.datos.hoy;
  const [y, m] = mes.split('-').map(Number);
  const ult = new Date(y, m, 0).getDate();
  const prev = fechaISO(new Date(y, m - 2, 1)).slice(0, 7), sig = fechaISO(new Date(y, m, 1)).slice(0, 7);
  let total = 0, diasTrab = 0, filas = '';

  for (let dn = ult; dn >= 1; dn--) {
    const f = mes + '-' + pad(dn);
    if (f > hoy) continue;
    const lista = h.fichajes.filter(x => x.fecha === f);
    const aus = h.ausencias.filter(a => a.desde <= f && a.hasta >= f);
    const fes = h.festivos.find(x => x.fecha === f);
    const incs = h.incidencias.filter(i => i.fecha === f);
    const laborable = hor.dias.indexOf(diaSemana(f)) >= 0;
    const c = calcular(lista, f === hoy ? minAhora() : null);
    if (c.trab > 0) { total += c.trab; diasTrab++; }
    const ef = efectivos(lista);
    const ent = ef.find(x => x.tipo === 'ENTRADA'), sal = [...ef].reverse().find(x => x.tipo === 'SALIDA');

    let det = '', chip = '';
    if (lista.length) {
      det = `${ent ? hm(ent.hora) : '--:--'} – ${sal ? hm(sal.hora) : '--:--'}<em>${c.pausa ? 'comida ' + dur(c.pausa) : 'sin pausa de comida'}</em>`;
      if (c.estado !== 'fin' && f !== hoy) chip = '<span class="chip mal">Incompleto</span>';
      else if (f === hoy && c.estado !== 'fin') chip = '<span class="chip inf">En curso</span>';
    } else if (aus.length) { det = esc(aus[0].tipo) + `<em>${aus[0].estado === 'Pendiente' ? 'pendiente de aprobar' : 'ausencia'}</em>`; }
    else if (fes) { det = esc(fes.nombre) + '<em>festivo</em>'; }
    else if (laborable && f !== hoy) { det = 'Sin fichajes'; chip = '<span class="chip mal">Revisar</span>'; }
    else det = f === hoy ? 'Sin fichajes todavía' : 'No laborable';
    if (incs.length) chip += ` <span class="chip ${incs.some(i => i.estado === 'Pendiente') ? 'esp' : 'ok'}">Incidencia</span>`;

    const apagado = !lista.length && !aus.length && (!laborable || fes);
    const d = new Date(f + 'T12:00:00');
    filas += `<div class="dia${apagado ? ' apagado' : ''}">
      <button data-dia="${f}" aria-expanded="${S.abierto === f}">
        <span class="n">${dn}<small>${DIAS_C[d.getDay()]}</small></span>
        <span class="det">${det}${chip ? '<br>' + chip : ''}</span>
        <span class="tot">${c.trab ? durCorta(c.trab) : ''}</span>
      </button>
      ${S.abierto === f ? `<div class="mas">${listaFichajes(lista) || '<div class="vacio">No hay fichajes este día.</div>'}
        ${incs.map(i => `<p class="vacio">Incidencia: ${esc(i.tipo)} · ${esc(i.estado)}</p>`).join('')}
        <button class="btn sec chico" data-nueva-inc="${f}" style="margin-top:10px">Comunicar incidencia</button></div>` : ''}
    </div>`;
  }

  $('vista').innerHTML = `
    <div class="mes">
      <button class="flecha" data-mes="${prev}" aria-label="Mes anterior">${ICON.izq}</button>
      <h1>${MESES[m - 1]} ${y}</h1>
      <button class="flecha" data-mes="${sig}" aria-label="Mes siguiente" ${sig > hoy.slice(0, 7) ? 'disabled' : ''}>${ICON.der}</button>
    </div>
    <div class="resumen"><div><b>${dur(total)}</b>trabajadas</div><div><b>${diasTrab}</b>${diasTrab === 1 ? 'día' : 'días'} con fichajes</div></div>
    ${filas ? `<div class="dias">${filas}</div>` : '<div class="vacio">Este mes todavía no ha empezado.</div>'}`;
}

/* ================================= SOLICITUDES ================================= */
async function cargarSolicitudes() {
  $('vista').innerHTML = '<div class="cargando">Cargando…</div>';
  try { S.sols = await api('misSolicitudes'); if (S.tab === 'inc' || S.tab === 'aus') pintarSolicitudes(); }
  catch (e) { errorVista(e); }
}

const chipEstado = e => `<span class="chip ${{ Aprobada: 'ok', Rechazada: 'mal', Pendiente: 'esp' }[e] || ''}">${esc(e)}</span>`;

    const l = S.sols.incidencias;

      <div class="cab-sec"><h1>Incidencias</h1><button class="btn" data-nueva-inc="">Comunicar incidencia</button></div>

      <div class="lista">${l.length ? l.map(i => `

          ${i.fichaje ? `<p>${esc(i.fichaje)}${i.horaCorrecta ? ' a las ' + esc(i.horaCorrecta) : ''}</p>` : ''}
          <p>${esc(i.descripcion)}</p>${i.comentario ? `<p>Respuesta: ${esc(i.comentario)}</p>` : ''}
          ${i.estado === 'Pendiente' ? `<div class="acc"><button class="btn peligro chico" data-clase="incidencia" data-anular="${esc(i.id)}">Anular</button></div>` : ''}
        </div>`).join('') : '<div class="vacio">No has comunicado ninguna incidencia.</div>'}</div>`;
  } else {
    const l = S.sols.ausencias;
    $('vista').innerHTML = `
      <div class="cab-sec"><h1>Ausencias</h1><button class="btn" data-nueva-aus>Registrar ausencia</button></div>
      <p class="ayuda">Vacaciones, citas médicas, permisos… Los días con una ausencia no generan recordatorios de fichaje.</p>
      <div class="lista">${l.length ? l.map(a => `
        <div class="sol"><div class="t1"><div><b>${esc(a.tipo)}</b><br><span class="chip">${a.desde === a.hasta ? fechaLarga(a.desde) : fechaCorta(a.desde) + ' – ' + fechaCorta(a.hasta)}</span>
          ${a.diaCompleto ? '' : `<span class="chip">${esc(a.horaIni)}–${esc(a.horaFin)}</span>`}</div>${chipEstado(a.estado)}</div>
          ${a.descripcion ? `<p>${esc(a.descripcion)}</p>` : ''}${a.comentario ? `<p>Respuesta: ${esc(a.comentario)}</p>` : ''}
          ${a.estado === 'Pendiente' ? `<div class="acc"><button class="btn peligro chico" data-clase="ausencia" data-anular="${esc(a.id)}">Anular</button></div>` : ''}
        </div>`).join('') : '<div class="vacio">No has registrado ninguna ausencia.</div>'}</div>`;
  }
}

function formIncidencia(fecha) {
  const hoy = S.datos.hoy;
  abrirHoja(`
    <h3>Comunicar incidencia</h3>
    <p class="sub">El fichaje original se conserva; la corrección se añade al aprobarse.</p>
    <div class="fila2">
      <div><label for="iF">Día</label><input type="date" id="iF" max="${hoy}" value="${fecha || hoy}"></div>
      <div><label for="iT">Tipo</label><select id="iT">${T_INC.map(t => `<option>${t}</option>`).join('')}</select></div>
    </div>
    <div class="fila2">
      <div><label for="iFi">Fichaje afectado</label><select id="iFi"><option value="">Ninguno</option>${Object.values(NOMBRE).map(n => `<option>${n}</option>`).join('')}</select></div>
      <div><label for="iH">Hora correcta</label><input type="time" id="iH"></div>
    </div>
    <label for="iD">Qué ha pasado</label>
    <textarea id="iD" maxlength="500" placeholder="Por ejemplo: entré a las 8:00 pero no tenía cobertura en la obra"></textarea>
    <div class="pie-hoja"><button class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="ok">Enviar incidencia</button></div>`);
  $('cancelar').onclick = cerrarHoja;
  $('ok').onclick = async () => {
    const o = { fecha: $('iF').value, tipo: $('iT').value, fichaje: $('iFi').value, horaCorrecta: $('iH').value, descripcion: $('iD').value.trim() };
    if (o.fichaje && !o.horaCorrecta && (o.tipo === 'Olvido de fichaje' || o.tipo === 'Fichaje erróneo')) return toast('Indica la hora correcta del fichaje.', true);
    const b = $('ok'); b.disabled = true;
    try { S.sols = await api('crearIncidencia', o); cerrarHoja(); toast('Incidencia enviada'); if (S.tab === 'hist') cargarHistorial(S.mes); else { S.tab = 'inc'; pintarTabs(); pintarSolicitudes(); } }
    catch (e) { b.disabled = false; toast(textoError(e), true); }
  };
}

function formAusencia() {
  const hoy = S.datos.hoy;
  abrirHoja(`
    <h3>Registrar ausencia</h3>
    <p class="sub">Administración recibirá un aviso para aprobarla.</p>
    <label for="aT">Motivo</label><select id="aT">${T_AUS.map(t => `<option>${t}</option>`).join('')}</select>
    <div class="fila2">
      <div><label for="aD">Desde</label><input type="date" id="aD" value="${hoy}"></div>
      <div><label for="aH">Hasta</label><input type="date" id="aH" value="${hoy}"></div>
    </div>
    <label class="interruptor"><input type="checkbox" id="aC" checked> Día completo</label>
    <div class="fila2" id="aHoras" hidden>
      <div><label for="aI">De</label><input type="time" id="aI"></div>
      <div><label for="aF">A</label><input type="time" id="aF"></div>
    </div>
    <label for="aN">Nota (opcional)</label><textarea id="aN" maxlength="500"></textarea>
    <div class="pie-hoja"><button class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="ok">Registrar ausencia</button></div>`);
  $('cancelar').onclick = cerrarHoja;
  $('aC').onchange = () => $('aHoras').hidden = $('aC').checked;
  $('aD').onchange = () => { if ($('aH').value < $('aD').value) $('aH').value = $('aD').value; };
  $('ok').onclick = async () => {
    const o = { tipo: $('aT').value, desde: $('aD').value, hasta: $('aH').value, diaCompleto: $('aC').checked, horaIni: $('aI').value, horaFin: $('aF').value, descripcion: $('aN').value.trim() };
    const b = $('ok'); b.disabled = true;
    try { S.sols = await api('crearAusencia', o); cerrarHoja(); toast('Ausencia registrada'); S.tab = 'aus'; pintarTabs(); pintarSolicitudes(); recargarInicio(); }
    catch (e) { b.disabled = false; toast(textoError(e), true); }
  };
}

async function anular(clase, id) {
  if (!confirm('¿Anular esta solicitud?')) return;
  try { S.sols = await api('anularSolicitud', clase, id); pintarSolicitudes(); toast('Solicitud anulada'); recargarInicio(); }
  catch (e) { toast(textoError(e), true); }
}

/* =================================== EQUIPO =================================== */
async function cargarEquipo() {
  $('vista').innerHTML = '<div class="cargando">Cargando el equipo…</div>';
  try { S.equipo = await api('panelEquipo'); S.pendAdmin = S.equipo.incidencias.length + S.equipo.ausencias.length; pintarTabs(); if (S.tab === 'eq') pintarEquipo(); }
  catch (e) { errorVista(e); }
}

function pintarEquipo() {
  const q = S.equipo, ya = minAhora();
  const gente = q.equipo.map(p => {
    const c = calcular(p.fichajes, ya);
    let clase = c.estado, txt;
    const hor = horarioDe(p.horario, q.hoy);
    if (p.ausencia) { clase = ''; txt = esc(p.ausencia.tipo); }
    else if (c.estado === 'fuera') {
      const tarde = p.laborable && !q.festivo && hor.entrada && ya > aMin(hor.entrada) + 10;
      clase = tarde ? 'tarde' : ''; txt = !p.laborable || q.festivo ? 'No laborable' : tarde ? 'Sin entrada (era a las ' + hor.entrada + ')' : 'Entra a las ' + (hor.entrada || '--:--');
    }
    else if (c.estado === 'trabajando') txt = 'Trabajando desde las ' + hm(c.desde);
    else if (c.estado === 'pausa') txt = 'Comiendo desde las ' + hm(c.desde);
    else txt = 'Salió a las ' + hm(c.desde);
    return `<div class="persona"><i class="${clase}"></i><div><b>${esc(p.nombre)}</b><small>${txt}</small></div><b>${c.trab ? durCorta(c.trab) : ''}</b></div>`;
  }).join('');

  const pendInc = q.incidencias.map(i => `
    <div class="sol"><div class="t1"><div><b>${esc(i.nombre)}</b><br><span class="chip">${fechaLarga(i.fecha)}</span> <span class="chip esp">${esc(i.tipo)}</span></div></div>
      ${i.fichaje ? `<p>${esc(i.fichaje)}${i.horaCorrecta ? ' a las ' + esc(i.horaCorrecta) : ''}</p>` : ''}<p>${esc(i.descripcion)}</p>
      <div class="acc"><button class="btn chico" data-clase="incidencia" data-resolver="${esc(i.id)}" data-ok="1">Aprobar</button>
      <button class="btn peligro chico" data-clase="incidencia" data-resolver="${esc(i.id)}" data-ok="0">Rechazar</button></div></div>`).join('');
  const pendAus = q.ausencias.map(a => `
    <div class="sol"><div class="t1"><div><b>${esc(a.nombre)}</b><br><span class="chip esp">${esc(a.tipo)}</span>
      <span class="chip">${a.desde === a.hasta ? fechaLarga(a.desde) : fechaCorta(a.desde) + ' – ' + fechaCorta(a.hasta)}</span>
      ${a.diaCompleto ? '' : `<span class="chip">${esc(a.horaIni)}–${esc(a.horaFin)}</span>`}</div></div>
      ${a.descripcion ? `<p>${esc(a.descripcion)}</p>` : ''}
      <div class="acc"><button class="btn chico" data-clase="ausencia" data-resolver="${esc(a.id)}" data-ok="1">Aprobar</button>
      <button class="btn peligro chico" data-clase="ausencia" data-resolver="${esc(a.id)}" data-ok="0">Rechazar</button></div></div>`).join('');

  $('vista').innerHTML = `
    <div class="cab-sec"><h1>Equipo hoy</h1></div>
    ${q.festivo ? `<div class="aviso info">Hoy es festivo: ${esc(q.festivo)}.</div>` : ''}
    <div class="dias">${gente || '<div class="vacio" style="padding:14px">No hay empleados activos.</div>'}</div>
    <div class="bloque"><h2>Incidencias por revisar</h2><div class="lista">${pendInc || '<div class="vacio">Nada pendiente.</div>'}</div></div>
    <div class="bloque"><h2>Ausencias por aprobar</h2><div class="lista">${pendAus || '<div class="vacio">Nada pendiente.</div>'}</div></div>`;
}

function confirmarResolucion(clase, id, ok) {
  abrirHoja(`
    <h3>${ok ? 'Aprobar' : 'Rechazar'} ${clase}</h3>
    <p class="sub">${ok && clase === 'incidencia' ? 'Si la incidencia indica fichaje y hora, se añadirá la corrección al registro.' : 'La persona recibirá un correo con la respuesta.'}</p>
    <label for="rC">Comentario (opcional)</label><textarea id="rC" maxlength="300" autofocus></textarea>
    <div class="pie-hoja"><button class="btn sec" id="cancelar">Cancelar</button><button class="btn ${ok ? '' : 'peligro'}" id="ok">${ok ? 'Aprobar' : 'Rechazar'}</button></div>`);
  $('cancelar').onclick = cerrarHoja;
  $('ok').onclick = async () => {
    $('ok').disabled = true;
    try {
      S.equipo = await api('resolver', clase, id, ok, $('rC').value.trim());
      S.pendAdmin = S.equipo.incidencias.length + S.equipo.ausencias.length;
      cerrarHoja(); pintarTabs(); pintarEquipo(); toast(ok ? 'Aprobada' : 'Rechazada'); recargarInicio();
    } catch (e) { $('ok').disabled = false; toast(textoError(e), true); }
  };
}

/* ==================================== Inicio ==================================== */
function errorVista(e) {
  $('vista').innerHTML = `<div class="error-total"><h2>No se ha podido cargar</h2><p>${esc(textoError(e))}</p><button class="btn" onclick="arrancar()">Reintentar</button></div>`;
}

async function recargarInicio() { try { S.datos = await api('inicio'); } catch (e) {} }

async function arrancar() {
  $('vista').innerHTML = '<div class="cargando">Cargando…</div>';
  try {
    S.datos = await api('inicio');
    $('yo').textContent = iniciales(S.datos.usuario.nombre);
    $('yo').title = S.datos.usuario.nombre;
    if (S.datos.usuario.admin) api('panelEquipo').then(q => { S.pendAdmin = q.incidencias.length + q.ausencias.length; pintarTabs(); }).catch(() => {});
    S.tab = 'hoy'; pintarTabs(); pintarHoy();
  } catch (e) { errorVista(e); }
}

// Al volver a la app desde otra (p. ej. tras el recordatorio), refresca el estado
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.datos) recargarInicio().then(() => { if (S.tab === 'hoy') pintarHoy(); });
});

/* ============================ MODO DE PRUEBA (sin Apps Script) ============================ */
const DEMO = (() => {
  const CLAVE = 'fichajes_pc_demo_v1';
  const YO = { email: 'adrian@poolconcept.es', nombre: 'Adrián Febrero', admin: true,
    horario: { entrada: '08:00', comidaIni: '14:00', comidaFin: '15:00', salida: '18:00', dias: [1, 2, 3, 4, 5], especiales: { 5: { entrada: '08:00', salida: '15:00', comidaIni: '', comidaFin: '' } } } };
  const VIE = { 5: { entrada: '08:00', salida: '15:00', comidaIni: '', comidaFin: '' } };
  const EQUIPO = [YO,
    { email: 'laura@poolconcept.es', nombre: 'Laura Gómez', horario: { entrada: '08:30', comidaIni: '14:00', comidaFin: '15:00', salida: '17:30', dias: [1, 2, 3, 4, 5], especiales: VIE } },
    { email: 'javier@poolconcept.es', nombre: 'Javier Ruiz', horario: { entrada: '07:30', comidaIni: '13:30', comidaFin: '14:30', salida: '17:00', dias: [1, 2, 3, 4, 5], especiales: VIE } }];
  let id = 1;
  const nid = p => p + '-' + Date.now() + '-' + (id++);
  const varia = (h, v) => { const m = aMin(h) + Math.round((Math.random() - .5) * v); return pad(Math.floor(m / 60)) + ':' + pad(Math.floor(m % 60)) + ':' + pad(Math.floor(Math.random() * 60)); };

  function sembrar() {
    const db = { fichajes: [], incidencias: [], ausencias: [] };
    const hoy = new Date();
    for (let i = 40; i >= 1; i--) {
      const d = new Date(hoy); d.setDate(d.getDate() - i);
      const f = fechaISO(d), dow = d.getDay();
      if (dow === 0 || dow === 6) continue;
      EQUIPO.forEach((p, k) => {
        if (k === 0 && i === 9) return; // un día sin fichajes
        const h = horarioDe(p.horario, f), add = (t, hora) => db.fichajes.push({ id: nid('F'), fecha: f, hora, email: p.email, nombre: p.nombre, tipo: t, origen: 'App', obs: '' });
        add('ENTRADA', varia(h.entrada, 14)); if (h.comidaIni) { add('PAUSA', varia(h.comidaIni, 10)); add('REANUDAR', varia(h.comidaFin, 10)); }
        if (!(k === 0 && i === 4)) add('SALIDA', varia(h.salida, 20)); // un día sin salida
      });
    }
    const d3 = new Date(hoy); d3.setDate(d3.getDate() - 9);
    db.ausencias.push({ id: nid('AUS'), registrada: fechaISO(d3) + ' 09:10', email: YO.email, nombre: YO.nombre, tipo: 'Cita médica', desde: fechaISO(d3), hasta: fechaISO(d3), diaCompleto: true, horaIni: '', horaFin: '', descripcion: '', estado: 'Aprobada', comentario: '' });
    const d1 = new Date(hoy); d1.setDate(d1.getDate() + 12); const d2 = new Date(d1); d2.setDate(d2.getDate() + 4);
    db.ausencias.push({ id: nid('AUS'), registrada: fechaISO(hoy) + ' 08:40', email: 'laura@poolconcept.es', nombre: 'Laura Gómez', tipo: 'Vacaciones', desde: fechaISO(d1), hasta: fechaISO(d2), diaCompleto: true, horaIni: '', horaFin: '', descripcion: 'Puente', estado: 'Pendiente', comentario: '' });
    const d4 = new Date(hoy); d4.setDate(d4.getDate() - 6);
    db.incidencias.push({ id: nid('INC'), registrada: fechaISO(hoy) + ' 08:05', email: 'javier@poolconcept.es', nombre: 'Javier Ruiz', fecha: fechaISO(d4), tipo: 'Fichaje erróneo', fichaje: 'Salida', horaCorrecta: '17:05', descripcion: 'Fiché la salida al llegar a casa', estado: 'Pendiente', comentario: '' });
    const hoyF = fechaISO(hoy), ya = minAhora();
    EQUIPO.slice(1).forEach(p => {
      if (ya > aMin(p.horario.entrada)) db.fichajes.push({ id: nid('F'), fecha: hoyF, hora: varia(p.horario.entrada, 8), email: p.email, nombre: p.nombre, tipo: 'ENTRADA', origen: 'App', obs: '' });
    });
    return db;
  }
  const leer = () => { try { return JSON.parse(localStorage.getItem(CLAVE)) || guardar(sembrar()); } catch (e) { return sembrar(); } };
  function guardar(db) { try { localStorage.setItem(CLAVE, JSON.stringify(db)); } catch (e) {} return db; }
  const hoy = () => fechaISO(new Date());
  const solapa = (a, f) => a.desde <= f && a.hasta >= f;
  const mias = (db) => ({ incidencias: db.incidencias.filter(i => i.email === YO.email).reverse(), ausencias: db.ausencias.filter(a => a.email === YO.email).reverse() });

  return {
    inicio() {
      const db = leer(), h = hoy();
      return { usuario: YO, hoy: h, ahora: horaAhora(), fichajes: db.fichajes.filter(f => f.email === YO.email && f.fecha === h),
        ausencias: db.ausencias.filter(a => a.email === YO.email && a.estado !== 'Rechazada' && a.estado !== 'Anulada' && solapa(a, h)), festivo: '', ajustes: { ubicacion: false } };
    },
    fichar(tipo, obs) {
      const db = leer(), h = hoy();
      const lista = db.fichajes.filter(f => f.email === YO.email && f.fecha === h);
      if (!permitidos(calcular(lista).estado)[tipo]) throw new Error('Ese fichaje no corresponde ahora.');
      db.fichajes.push({ id: nid('F'), fecha: h, hora: horaAhora(), email: YO.email, nombre: YO.nombre, tipo, origen: 'App', obs: obs || '' });
      guardar(db);
      return { fichajes: db.fichajes.filter(f => f.email === YO.email && f.fecha === h) };
    },
    historial(mes) {
      const db = leer();
      return { fichajes: db.fichajes.filter(f => f.email === YO.email && f.fecha.slice(0, 7) === mes),
        ausencias: db.ausencias.filter(a => a.email === YO.email && a.estado !== 'Rechazada' && a.estado !== 'Anulada' && a.desde <= mes + '-31' && a.hasta >= mes + '-01'),
        incidencias: db.incidencias.filter(i => i.email === YO.email && i.fecha.slice(0, 7) === mes), festivos: [] };
    },
    misSolicitudes() { return mias(leer()); },
    crearIncidencia(o) {
      if (!o.descripcion) throw new Error('Explica brevemente qué ha pasado.');
      const db = leer(); db.incidencias.push(Object.assign({ id: nid('INC'), registrada: hoy() + ' ' + horaAhora().slice(0, 5), email: YO.email, nombre: YO.nombre, estado: 'Pendiente', comentario: '' }, o));
      return mias(guardar(db));
    },
    crearAusencia(o) {
      if (o.hasta < o.desde) throw new Error('La fecha final no puede ser anterior a la inicial.');
      if (!o.diaCompleto && (!o.horaIni || !o.horaFin)) throw new Error('Indica las horas de la ausencia.');
      const db = leer(); db.ausencias.push(Object.assign({ id: nid('AUS'), registrada: hoy() + ' ' + horaAhora().slice(0, 5), email: YO.email, nombre: YO.nombre, estado: 'Pendiente', comentario: '' }, o));
      return mias(guardar(db));
    },
    anularSolicitud(clase, idS) {
      const db = leer(); const l = clase === 'incidencia' ? db.incidencias : db.ausencias;
      const x = l.find(s => s.id === idS); if (x) x.estado = 'Anulada'; return mias(guardar(db));
    },
    panelEquipo() {
      const db = leer(), h = hoy(), dow = diaSemana(h);
      return { hoy: h, festivo: '', equipo: EQUIPO.map(p => ({ email: p.email, nombre: p.nombre, horario: p.horario, laborable: p.horario.dias.indexOf(dow) >= 0,
        fichajes: db.fichajes.filter(f => f.email === p.email && f.fecha === h), ausencia: db.ausencias.find(a => a.email === p.email && a.estado === 'Aprobada' && solapa(a, h)) || null })),
        incidencias: db.incidencias.filter(i => i.estado === 'Pendiente'), ausencias: db.ausencias.filter(a => a.estado === 'Pendiente') };
    },
    resolver(clase, idS, ok, com) {
      const db = leer(); const l = clase === 'incidencia' ? db.incidencias : db.ausencias;
      const x = l.find(s => s.id === idS); if (!x) throw new Error('No se encuentra la solicitud.');
      x.estado = ok ? 'Aprobada' : 'Rechazada'; x.comentario = com || '';
      const tipo = { 'Entrada': 'ENTRADA', 'Pausa comida': 'PAUSA', 'Reanudar': 'REANUDAR', 'Salida': 'SALIDA' }[x.fichaje];
      if (clase === 'incidencia' && ok && tipo && x.horaCorrecta)
        db.fichajes.push({ id: nid('F'), fecha: x.fecha, hora: x.horaCorrecta + ':00', email: x.email, nombre: x.nombre, tipo, origen: (x.tipo === 'Fichaje erróneo' ? 'Sustituye' : 'Añadido') + ' (' + x.id + ')', obs: 'Corrección aprobada' });
      guardar(db); return this.panelEquipo();
    }
  };
})();

arrancar();
</script>
